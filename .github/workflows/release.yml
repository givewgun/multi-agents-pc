name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify & pack only, skip npm publish and GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
          fi
          if [[ "$PKG_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: npm test

      - name: Pack and verify tarball install
        id: pack
        run: |
          OUT=$(node scripts/verify-pack.mjs --keep-tarball)
          echo "$OUT"
          TGZ=$(echo "$OUT" | sed -n 's/^TARBALL=//p' | tail -n 1)
          test -f "$TGZ"
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Upload verified tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7

  publish-npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Ensure npm supports OIDC Trusted Publishing
        run: npm install -g npm@latest
      - name: Publish verified tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          fi
          EXTRA_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--tag next"
          fi
          npm publish "./$TARBALL" --provenance --access public $EXTRA_ARGS

  github-release:
    needs: [verify, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh reads the repo from the checkout's origin remote; auth comes from GH_TOKEN,
      # so git credentials don't need to persist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          EXTRA_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" "./$TARBALL" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $EXTRA_ARGS
