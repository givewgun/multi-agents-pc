name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: CLI smoke test (no agents needed)
        run: |
          node bin/tandem.js --version
          node bin/tandem.js help
          node bin/tandem.js route "write unit tests for the parser"
          node bin/tandem.js doctor
          node bin/tandem.js init tmp-init --mcp
      - name: Verify package tarball install
        run: node scripts/verify-pack.mjs
